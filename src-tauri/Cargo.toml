[package]
name = "cargooptimizer"
version = "1.0.0"
description = "Offline Ingilizce <-> Turkce denizcilik sozlugu"
authors = ["Recep Oguz Yagbasan"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
